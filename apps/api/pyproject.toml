[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
